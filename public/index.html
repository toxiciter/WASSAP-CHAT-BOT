<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp QR Login</title>
  <style>
    body {
      background: #0e1117;
      color: #eee;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    img {
      width: 280px;
      height: 280px;
      border: 4px solid #00ff80;
      border-radius: 10px;
      box-shadow: 0 0 15px #00ff80aa;
    }
    h3 {
      color: #00ffff;
      box-shadow: 0 0 15px #00ffffaa;
    }
    h1 {
      color: #ff00ff;
      box-shadow: 0 0 15px #ff00ff;
    }
    h4 {
      color: maroon;
    }
  </style>
</head>
<body>
  <h4>Author => ♡︎ 𝐻𝐴𝑆𝐴𝑁 ♡︎</h4>
  <h1>WHATSAPP CHATBOT</h1>
  <img id="qr" src="qr.png" alt="QR CODE MISSING - ♡︎ 𝐻𝐴𝑆𝐴𝑁 ♡︎">
  <h3>Scene this QR code in your Whatsapp Account For login Whatsapp chatBot</h3>
  

  <script>
    let lastUpdate = 0;
    async function checkQR() {
      const res = await fetch('/qr');
      const data = await res.json();
      if (data.timestamp && data.timestamp !== lastUpdate) {
        lastUpdate = data.timestamp;
        document.getElementById('qr').src = 'qr.png?t=' + Date.now();
      }
    }
    setInterval(checkQR, 5000);
  </script>
</body>
</html>
