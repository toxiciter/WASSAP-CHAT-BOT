<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp QR Login</title>
  <style>
    body {
      background: #0e1117;
      color: #eee;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    img {
      width: 280px;
      height: 280px;
      border: 4px solid #00ff80;
      border-radius: 10px;
      box-shadow: 0 0 15px #00ff80aa;
    }
    h2 {
      margin-top: 20px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h1>📱 WhatsApp Web QR</h1>
  <img id="qr" src="qr.png" alt="QR Code">
  <h2>স্ক্যান করো তোমার WhatsApp দিয়ে</h2>

  <script>
    // প্রতি 5 সেকেন্ডে চেক করবে নতুন QR এসেছে কিনা
    let lastUpdate = 0;
    async function checkQR() {
      const res = await fetch('/qr-updated');
      const data = await res.json();
      if (data.timestamp && data.timestamp !== lastUpdate) {
        lastUpdate = data.timestamp;
        document.getElementById('qr').src = 'qr.png?t=' + Date.now();
      }
    }
    setInterval(checkQR, 5000);
  </script>
</body>
</html>
